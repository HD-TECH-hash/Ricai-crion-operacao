<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RIC AI — CRION</title>
<style>
  :root{
    /* Paleta pedida */
    --alert:#fe0000;
    --sites:#0001fc;
    --procs:#fe6700;
    --search:#31a59c;
    --shadow:#50d9cd;

    --postit:#fddb56;
    --calc:#5fa5fa;
    --feedback:#5fa5fa; 

    --ink:#0f172a;
    --muted:#64748b;
    --line:#e7eef7;

    /* Fundo ÚNICO SOLIDO (Cor: --bg1) */
    --bg1:#4889c5;
    --bg2:#4889c5; 
    --bg-header: rgba(72, 137, 197, 0.95);

    /* PDFs – amarelo claro (Corrigido) */
    --pdf-bg:#FFFFE0;
    --pdf-bd:#FAFAD2;
  }

  .tool-home {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:transparent;
  }
  .tool-home img {
    width:22px;
    height:22px;
    filter:invert(1);
  }
  .tool-home span {
    font-size:12px;
    font-weight:700;
    color:#fff;
    line-height:1;
    margin-top:2px;
  }
</style>
</head>
<body>
  <div class="floatbar">
    <div class="floatbar-inner">
      <img class="logo-left" src="https://raw.githubusercontent.com/HD-TECH-hash/Ricai-crion-operacao/main/icon2.png" alt="icon2">

      <div class="tools">
        <button id="btnHome" class="tool tool-home" title="Home">
          <img src="https://cdn-icons-png.flaticon.com/512/25/25694.png" alt="Home">
          <span>Home</span>
        </button>
        <button id="toggleNote" class="tool tool-postit" title="Post-it">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M8 3h8a3 3 0 0 1 3 3v7l-7 7H8a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Z" stroke="#222" stroke-width="2" fill="#fde68a"/>
            <path d="M19 13h-4a3 3 0 0 0-3 3v4" stroke="#222" stroke-width="2"/>
          </svg>
        </button>
        <button id="toggleCalc" class="tool tool-calc" title="Calculadora">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="4" y="3" width="16" height="18" rx="2" stroke="#0b2555" stroke-width="2" fill="#dbeafe"/>
            <rect x="7" y="6" width="10" height="3" rx="1" fill="#0b2555"/>
            <path d="M8 12h2M8 16h2M12 12h2M12 16h2M16 12h2M16 16h2" stroke="#0b2555" stroke-width="2"/>
          </svg>
        </button>
      </div>

      <img class="logo-right" src="https://raw.githubusercontent.com/HD-TECH-hash/Ricai-crion-operacao/main/HDS.png" alt="HDSTEC">
    </div>
  </div>

  <script>
    window.onload = function() {
      const btnHome = document.getElementById('btnHome');
      if(btnHome){
        btnHome.addEventListener('click', ()=> {
          // Limpa campos, localStorage, sessionStorage se existir
          document.querySelectorAll('input').forEach(i => i.value = '');
          document.querySelectorAll('textarea').forEach(t => t.value = '');
          localStorage.clear();
          sessionStorage.clear();
          // Volta para home
          window.location.href = "/";
        });
      }
    }
  </script>
</body>
</html>
